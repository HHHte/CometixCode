# Writers must go through the process-env carrier (PORTING.md "Global
# process.env carrier"): raw set_var/remove_var desyncs the carrier's owned
# environment and is UB on Unix when any other thread may call getenv.
# The only allowed sites are the carrier's own transitional real-env
# write-through (utils/process_env.rs) and the Windows CreateProcess harden
# write at the entrypoint (entrypoints/cli.rs), both annotated with
# `#[allow(clippy::disallowed_methods)]`.
[[disallowed-methods]]
path = "std::env::set_var"
reason = "write through crate::utils::process_env instead (set/begin_update); see PORTING.md 'Global process.env carrier'"

[[disallowed-methods]]
path = "std::env::remove_var"
reason = "write through crate::utils::process_env instead (remove/begin_update); see PORTING.md 'Global process.env carrier'"
